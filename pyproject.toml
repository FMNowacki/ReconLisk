[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconlisk"
version = "0.2.2"
description = "A lightweight asyncio-based TCP port scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
reconlisk = "portscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]